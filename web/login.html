<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem KRS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 900px;
            max-width: 100%;
            min-height: 520px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.10);
        }

        .login-info {
            flex: 1;
            background: #123b68;
            color: white;
            padding: 55px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-info .brand {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #bfdbfe;
        }

        .login-info h1 {
            font-size: 34px;
            line-height: 1.3;
            margin-bottom: 18px;
        }

        .login-info p {
            font-size: 15px;
            line-height: 1.8;
            color: #dbeafe;
        }

        .login-form {
            flex: 1;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form h2 {
            font-size: 27px;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .login-form .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 700px) {
            .login-container {
                flex-direction: column;
            }

            .login-info {
                padding: 35px 30px;
            }

            .login-info h1 {
                font-size: 27px;
            }

            .login-form {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-info">
            <div class="brand">SISTEM INFORMASI AKADEMIK</div>

            <h1>Sistem Pengisian Kartu Rencana Studi</h1>

            <p>
                Selamat datang di Sistem KRS.
                Silakan masuk menggunakan akun yang telah
                terdaftar untuk mengakses layanan akademik.
            </p>
        </div>

        <div class="login-form">

            <h2>Selamat Datang!</h2>

            <p class="subtitle">
                Masuk untuk melanjutkan ke sistem KRS.
            </p>

            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username"
                        autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-button">
                    Masuk
                </button>

            </form>

            <div class="footer">
                &copy; 2026 Sistem KRS. All Rights Reserved.
            </div>

        </div>

    </div>

</body>

</html>
